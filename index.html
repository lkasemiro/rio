<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atlas | Ecossistema Pessoal</title>

    <meta name="theme-color"
          content="#0B1020">

    <link rel="manifest"
          href="manifest.json">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<!-- =======================================================
     APP
======================================================= -->

<div id="app">

    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                🌎
            </div>

            <div>

                <h1>Atlas</h1>

                <p>
                    Gestão do Ecossistema Pessoal
                </p>

            </div>

        </div>

        <div class="top-actions">

            <button id="btnExportar"
                    class="header-btn">

                Exportar

            </button>

        </div>

    </header>

    <!-- ===================================================
         DASHBOARD VIEW
    ==================================================== -->

    <section id="dashboardView"
             class="view active">

        <!-- ===========================================
             GRÁFICO
        ============================================ -->

        <div class="dashboard-card">

            <h2>
                Distribuição do Tempo
            </h2>

            <div class="chart-container">

                <canvas id="atlasChart">
                </canvas>

                <div class="chart-center">

                    <span>Total</span>

                    <strong id="totalHoras">
                        0h
                    </strong>

                </div>

            </div>

        </div>

        <!-- ===========================================
             RESUMO
        ============================================ -->

        <div class="summary-grid">

            <div class="summary-card">

                <h3>Horas Totais</h3>

                <strong id="resumoHoras">
                    0h
                </strong>

            </div>

            <div class="summary-card">

                <h3>Sessões</h3>

                <strong id="resumoSessoes">
                    0
                </strong>

            </div>

            <div class="summary-card">

                <h3>Tarefas</h3>

                <strong id="resumoTarefas">
                    0
                </strong>

            </div>

        </div>

        <!-- ===========================================
             ATIVIDADES
        ============================================ -->

        <div class="activities-header">

            <h2>
                Atividades
            </h2>

        </div>

        <div id="activitiesGrid"
             class="activities-grid">

            <!-- preenchido via JS -->

        </div>

    </section>

    <!-- ===================================================
         ACTIVITY VIEW
    ==================================================== -->

    <section id="activityView"
             class="view">

        <!-- ===========================================
             TOPO
        ============================================ -->

        <div id="activityHero"
             class="activity-hero">

            <button id="btnVoltar"
                    class="back-btn">

                ← Dashboard

            </button>

            <h1 id="activityNome">

                DMA-CEDAE

            </h1>

            <p id="activityCategoria">

                Profissional

            </p>

        </div>

        <!-- ===========================================
             MÉTRICAS
        ============================================ -->

        <div class="metrics-grid">

            <div class="metric-card">

                <span>
                    Tempo Total
                </span>

                <strong id="activityTempoTotal">

                    0h

                </strong>

            </div>

            <div class="metric-card">

                <span>
                    Sessões
                </span>

                <strong id="activityTotalSessoes">

                    0

                </strong>

            </div>

        </div>

        <!-- ===========================================
             TIMER
        ============================================ -->

        <div class="panel">

            <h2>
                Cronômetro
            </h2>

            <div id="timerDisplay"
                 class="timer-display">

                00:00:00

            </div>

            <div class="timer-buttons">

                <button id="btnIniciar"
                        class="btn-primary">

                    ▶ Iniciar

                </button>

                <button id="btnPausar"
                        class="btn-secondary">

                    ⏸ Pausar

                </button>

                <button id="btnEncerrar"
                        class="btn-danger">

                    ■ Encerrar

                </button>

            </div>

        </div>

        <!-- ===========================================
             METAS
        ============================================ -->

        <div class="panel">

            <h2>
                Metas
            </h2>

            <div class="meta-row">

                <label>

                    Meta de Horas Semanais

                </label>

                <input type="number"
                       id="metaHoras">

            </div>

            <div class="meta-row">

                <label>

                    Meta de Tarefas Semanais

                </label>

                <input type="number"
                       id="metaTarefas">

            </div>

        </div>

        <!-- ===========================================
             TAREFAS
        ============================================ -->

        <div class="panel">

            <h2>
                Tarefas
            </h2>

            <div class="add-row">

                <input type="text"
                       id="novaTarefa"
                       placeholder="Nova tarefa">

                <button id="btnAdicionarTarefa">

                    Adicionar

                </button>

            </div>

            <div id="listaTarefas">

            </div>

        </div>

        <!-- ===========================================
             PROJETOS
        ============================================ -->

        <div class="panel">

            <h2>
                Projetos
            </h2>

            <div class="add-row">

                <input type="text"
                       id="novoProjeto"
                       placeholder="Nome do projeto">

                <button id="btnAdicionarProjeto">

                    Adicionar

                </button>

            </div>

            <div id="listaProjetos">

            </div>

        </div>

        <!-- ===========================================
             NOTAS
        ============================================ -->

        <div class="panel">

            <h2>
                Diário e Anotações
            </h2>

            <textarea id="novaNota"
                      rows="6"
                      placeholder="Escreva suas observações..."></textarea>

            <button id="btnSalvarNota"
                    class="btn-primary">

                Salvar Nota

            </button>

            <div id="listaNotas">

            </div>

        </div>

    </section>

</div>

<!-- =======================================================
     SCRIPTS
======================================================= -->

<script src="js/storage.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/activity.js"></script>

<script src="js/timer.js"></script>

<script src="js/app.js"></script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js");

    });

}

</script>

</body>

</html>
